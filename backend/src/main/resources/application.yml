server:
  port: 8787
  address: 0.0.0.0

spring:
  application:
    name: media-studio
  # The shared posts database is optional and set in Settings at run time: PostSync opens it and runs
  # Flyway itself (db/migration), so Spring must not try to configure a DataSource or migrate on start.
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
  mvc:
    async:
      request-timeout: -1
  web:
    resources:
      cache:
        # Revalidate the UI on every load so a rebuilt app never shows a stale index.html.
        cachecontrol:
          no-cache: true

logging:
  level:
    root: INFO
