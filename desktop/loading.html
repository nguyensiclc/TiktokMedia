<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Media Studio</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0f1115; color: #e6e8ee; font-family: 'Segoe UI', sans-serif; }
    body { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
    .spin { width: 36px; height: 36px; border: 3px solid #2a2f3a; border-top-color: #7c5cff; border-radius: 50%; animation: s 1s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    p { color: #8b93a5; }
  </style>
</head>
<body>
  <div class="spin"></div>
  <p>Đang khởi động Media Studio…</p>
</body>
</html>
